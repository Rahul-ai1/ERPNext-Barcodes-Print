name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Install (${{ matrix.frappe_branch }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - frappe_branch: version-15
            python_version: "3.11"
            node_version: 18
          - frappe_branch: version-16
            python_version: "3.14"
            node_version: 24
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      SITE: test_site
    steps:
      - uses: actions/checkout@v4
        with:
          path: barcodes_print
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node_version }}
      - name: Install bench
        run: |
          pip install frappe-bench
          sudo apt-get update && sudo apt-get install -y libmariadb-dev
      - name: Init bench with Frappe and ERPNext (${{ matrix.frappe_branch }})
        run: |
          bench init --skip-redis-config-generation --frappe-branch ${{ matrix.frappe_branch }} --python "$(which python)" ~/frappe-bench
          cd ~/frappe-bench
          bench get-app --branch ${{ matrix.frappe_branch }} erpnext https://github.com/frappe/erpnext
          bench get-app barcodes_print "$GITHUB_WORKSPACE/barcodes_print"
          bench set-config -g db_host 127.0.0.1
          bench set-config -g redis_cache redis://127.0.0.1:6379
          bench set-config -g redis_queue redis://127.0.0.1:6379
          bench set-config -g redis_socketio redis://127.0.0.1:6379
      - name: Create site and install apps
        run: |
          cd ~/frappe-bench
          bench new-site "$SITE" --db-root-password root --admin-password admin --mariadb-user-host-login-scope='%'
          bench --site "$SITE" set-config allow_tests true
          bench --site "$SITE" install-app erpnext
          bench --site "$SITE" install-app barcodes_print
      - name: Migrate again
        run: |
          cd ~/frappe-bench
          bench --site "$SITE" migrate
      - name: Run barcodes_print test suite
        run: |
          cd ~/frappe-bench
          bench --site "$SITE" run-tests --app barcodes_print
      - name: Uninstall and check nothing is left behind
        run: |
          cd ~/frappe-bench
          bench --site "$SITE" uninstall-app barcodes_print --yes --no-backup > uninstall.log 2>&1 || { cat uninstall.log; echo "::error title=uninstall::$(tail -5 uninstall.log | tr '\n' ' ')"; exit 1; }
          cat uninstall.log
